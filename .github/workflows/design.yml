name: Check calendar interface
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-design.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_map.py
      - run: python generate.py --start 2026-09-23 --output-dir /tmp/sun-design-preview
      - name: Browser checks
        run: |
          python -m http.server 8790 --directory /tmp/sun-design-preview > /tmp/sun-http.log 2>&1 &
          python scripts/test_ui.py --output /tmp/sun-ui-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun-calendar-interface-review
          path: /tmp/sun-ui-review/
